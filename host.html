<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Bee - Host Dashboard</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #1e222b; color: white; margin: 0; padding: 20px; }
    .card { background: #2c313c; max-width: 600px; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    .btn { background: #61dafb; color: #1e222b; border: none; padding: 14px 20px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 10px 5px; transition: background 0.2s; }
    .btn:hover { background: #4fa8d1; }
    .btn-danger { background: #dc3545; color: white; }
    .room-badge { font-size: 32px; font-weight: bold; color: #61dafb; letter-spacing: 2px; margin: 10px 0; }
    .player-list, .leaderboard { list-style: none; padding: 0; text-align: left; max-height: 250px; overflow-y: auto; }
    .player-list li, .leaderboard li { background: #20232a; margin: 6px 0; padding: 10px 14px; border-radius: 6px; display: flex; justify-content: space-between; font-weight: bold; }
    .timer-display { font-size: 36px; font-weight: bold; color: #ff6b6b; margin: 15px 0; }
    .q-title { font-size: 22px; margin: 15px 0; color: #fff; }
    .opt-box { background: #3b4049; padding: 10px; margin: 6px 0; border-radius: 6px; text-align: left; }
  </style>
</head>
<body>

  <!-- LOBBY SCREEN -->
  <div class="card" id="lobbyScreen">
    <h2>Quiz Bee Host Dashboard</h2>
    <p>Room Code:</p>
    <div class="room-badge" id="displayRoomCode">GENERATING...</div>
    <h3>Connected Players (<span id="playerCount">0</span>)</h3>
    <ul class="player-list" id="playerList"></ul>
    <button class="btn" onclick="startQuiz()">🚀 Start Quiz</button>
  </div>

  <!-- QUESTION CONTROL SCREEN -->
  <div class="card" id="hostQuestionScreen" style="display:none;">
    <div style="color: #61dafb; font-weight: bold;" id="hostQCounter">Question 1</div>
    <div class="timer-display">⏱️ <span id="hostTimer">10</span>s</div>
    <h3 class="q-title" id="hostQText">Question text goes here...</h3>
    <div id="hostOptions"></div>
    <br>
    <button class="btn btn-danger" onclick="endQuestionEarly()">🛑 Stop Timer</button>
  </div>

  <!-- SCOREBOARD SCREEN -->
  <div class="card" id="hostScoreScreen" style="display:none;">
    <h2>📊 Current Leaderboard</h2>
    <ul class="leaderboard" id="hostLeaderboard"></ul>
    <button class="btn" onclick="nextQuestion()">➡️ Next Question</button>
  </div>

  <script>
    let peer = null;
    let connections = {};
    let players = []; 
    let currentQIndex = 0;
    let timerInterval = null;
    let timeLeft = 10;
    let roomCode = 'QUIZ' + Math.floor(1000 + Math.random() * 9000);

    // Sample Question Pool
    const quizData = [
      { round: "Round 1", points: 1, timerDuration: 10, question: "What is the powerhouse of the cell?", options: ["Nucleus", "Mitochondria", "Ribosome", "Golgi Body"], correct: 1, qType: "mcq" },
      { round: "Round 1", points: 1, timerDuration: 10, question: "What element does 'O' represent on the periodic table?", options: ["Osmium", "Oxygen", "Gold", "Olive"], correct: 1, qType: "mcq" }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('displayRoomCode').innerText = roomCode;
      peer = new Peer(roomCode);

      peer.on('open', (id) => {
        console.log('Host Peer ID initialized:', id);
      });

      peer.on('connection', (conn) => {
        conn.on('data', (data) => {
          if (data.type === 'join') {
            connections[data.uid] = conn;
            let existing = players.find(p => p.uid === data.uid);
            if (!existing) {
              const fullIdentifier = data.section ? `${data.name} (${data.section})` : data.name;
              players.push({ uid: data.uid, name: fullIdentifier, score: 0, currentAnswer: null });
            }
            updateLobbyUI();
          } else if (data.type === 'answer') {
            let p = players.find(item => item.uid === conn.peer || connections[item.uid] === conn);
            if (p) { p.currentAnswer = data.option; }
          }
        });
      });
    });

    function updateLobbyUI() {
      document.getElementById('playerCount').innerText = players.length;
      document.getElementById('playerList').innerHTML = players.map(p => `<li>${p.name}</li>`).join('');
    }

    function broadcast(data) {
      Object.values(connections).forEach(conn => {
        if (conn && conn.open) conn.send(data);
      });
    }

    function startQuiz() {
      if (players.length === 0) return alert('Wait for at least 1 player to join!');
      currentQIndex = 0;
      loadQuestion(currentQIndex);
    }

    function loadQuestion(index) {
      if (index >= quizData.length) return finishQuiz();

      const q = quizData[index];
      players.forEach(p => p.currentAnswer = null);

      document.getElementById('lobbyScreen').style.display = 'none';
      document.getElementById('hostScoreScreen').style.display = 'none';
      document.getElementById('hostQuestionScreen').style.display = 'block';

      document.getElementById('hostQCounter').innerText = `Question ${index + 1} of ${quizData.length}`;
      document.getElementById('hostQText').innerText = q.question;
      document.getElementById('hostOptions').innerHTML = q.options.map((opt, i) => `<div class="opt-box">${String.fromCharCode(65+i)}. ${opt}</div>`).join('');

      timeLeft = q.timerDuration;
      document.getElementById('hostTimer').innerText = timeLeft;

      // Send question instantly to all players
      broadcast({
        type: 'question',
        qIndex: index,
        round: q.round,
        points: q.points,
        question: q.question,
        options: q.options,
        qType: q.qType,
        timerDuration: q.timerDuration
      });

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('hostTimer').innerText = timeLeft;
        broadcast({ type: 'tick', time: timeLeft, qIndex: index });

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          evaluateAnswers();
        }
      }, 1000);
    }

    function endQuestionEarly() {
      if (timerInterval) clearInterval(timerInterval);
      evaluateAnswers();
    }

    function evaluateAnswers() {
      const q = quizData[currentQIndex];
      players.forEach(p => {
        if (p.currentAnswer === q.correct) {
          p.score += q.points;
        }
      });

      players.sort((a, b) => b.score - a.score);

      broadcast({
        type: 'scoreboard',
        leaderboard: players.map(p => ({ name: p.name, score: p.score })),
        correctAnswerText: q.options[q.correct]
      });

      document.getElementById('hostQuestionScreen').style.display = 'none';
      document.getElementById('hostScoreScreen').style.display = 'block';
      document.getElementById('hostLeaderboard').innerHTML = players.map((p, i) => `<li><span>${i+1}. ${p.name}</span> <span>${p.score} pts</span></li>`).join('');
    }

    function nextQuestion() {
      currentQIndex++;
      loadQuestion(currentQIndex);
    }

    function finishQuiz() {
      broadcast({
        type: 'end',
        leaderboard: players.map(p => ({ name: p.name, score: p.score }))
      });
      alert('Quiz Finished!');
    }
  </script>
</body>
</html>
