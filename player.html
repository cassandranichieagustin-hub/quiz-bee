<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Bee - Player</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #282c34; color: white; margin: 0; padding: 20px; }
    .card { background: #3b4049; max-width: 400px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    input { width: 85%; padding: 12px; margin-bottom: 12px; border-radius: 6px; border: none; font-size: 16px; text-align: center; }
    .btn { background: #61dafb; color: #282c34; border: none; padding: 16px; width: 100%; margin: 8px 0; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: left; }
    .btn:disabled { background: #666; cursor: not-allowed; }
    .info-bar { background: #20232a; padding: 8px; border-radius: 6px; margin-bottom: 12px; font-weight: bold; color: #61dafb; }
    .clincher-bar { background: #6f42c1; color: white; }
  </style>
</head>
<body>

  <!-- JOIN SCREEN -->
  <div class="card" id="joinScreen">
    <h2>Join Quiz Bee</h2>
    <input type="text" id="roomInput" placeholder="Enter Room Code (e.g. QUIZ-1234)" />
    <input type="text" id="username" placeholder="Enter Your Name" />
    <button class="btn" style="text-align: center;" onclick="joinGame()">Join Room</button>
  </div>

  <!-- WAITING SCREEN -->
  <div class="card" id="waitingScreen" style="display:none;">
    <h2>Connected! 🚀</h2>
    <p>Look at the main host screen for questions.</p>
  </div>

  <!-- QUESTION SCREEN -->
  <div class="card" id="questionScreen" style="display:none;">
    <div class="info-bar" id="roundInfo">Round 1</div>
    <h3 id="qText">Waiting...</h3>
    <div id="optionsContainer"></div>
  </div>

  <!-- SCOREBOARD WAIT SCREEN -->
  <div class="card" id="scoreScreen" style="display:none;">
    <h2>Round Complete! 📊</h2>
    <h3 id="myScoreText" style="color: #61dafb; font-size: 24px;">Your Score: 0 pts</h3>
    <p>Check the host screen for rankings.</p>
  </div>

  <script>
    // Auto-fill Room Code if passed via URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get('room') || urlParams.get('host');
    if (roomFromUrl) {
      document.getElementById('roomInput').value = roomFromUrl;
    }

    let peer = null;
    let conn = null;
    let playerName = '';

    function joinGame() {
      const roomCode = document.getElementById('roomInput').value.trim().toUpperCase();
      playerName = document.getElementById('username').value.trim();

      if (!roomCode || !playerName) {
        return alert('Please enter both the Room Code and your Name!');
      }

      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(roomCode);

        conn.on('open', () => {
          conn.send({ type: 'join', name: playerName });
          document.getElementById('joinScreen').style.display = 'none';
          document.getElementById('waitingScreen').style.display = 'block';
        });

        conn.on('data', (data) => {
          if (data.type === 'question') {
            document.getElementById('waitingScreen').style.display = 'none';
            document.getElementById('scoreScreen').style.display = 'none';
            document.getElementById('questionScreen').style.display = 'block';
            showQuestion(data);
          } else if (data.type === 'scoreboard') {
            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('scoreScreen').style.display = 'block';
            
            const me = data.leaderboard.find(p => p.name === playerName);
            if (me) {
              document.getElementById('myScoreText').innerText = `Your Total Score: ${me.score} pts`;
            }
          } else if (data.type === 'end') {
            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('scoreScreen').style.display = 'none';
            document.getElementById('waitingScreen').style.display = 'block';
            document.getElementById('waitingScreen').innerHTML = `<h2>Quiz Ended!</h2><h3>Winner: ${data.winner}</h3>`;
          }
        });

        conn.on('error', (err) => {
          alert("Could not connect to Room Code. Check the host screen!");
        });
      });
    }

    function showQuestion(data) {
      const infoBar = document.getElementById('roundInfo');
      infoBar.innerText = `${data.round.toUpperCase()} • ${data.points} PT${data.points > 1 ? 'S' : ''}`;
      infoBar.className = data.round.includes("Clincher") ? "info-bar clincher-bar" : "info-bar";

      document.getElementById('qText').innerText = data.question;
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      const letters = ['A', 'B', 'C', 'D'];

      data.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = `${letters[idx]}. ${opt}`;
        
        btn.onclick = () => {
          conn.send({ type: 'answer', option: idx });
          document.querySelectorAll('.btn').forEach(b => b.disabled = true);
          btn.style.background = '#4CAF50';
          btn.style.color = 'white';
        };
        container.appendChild(btn);
      });
    }
  </script>
</body>
</html>
